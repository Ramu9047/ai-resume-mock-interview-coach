# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
cors.allowed-origins=${ALLOWED_ORIGINS:}


# ─── MongoDB ──────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/resume_coach}
spring.data.mongodb.auto-index-creation=true

# ─── Groq API ─────────────────────────────────────────────────────────────────
# Set GROQ_API_KEY as an environment variable or in .env
groq.api.key=${GROQ_API_KEY:}
groq.api.base-url=https://api.groq.com/openai/v1
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ─── Admin Analytics Authentication ────────────────────────────────────────────
admin.analytics.secret-key=${ADMIN_ANALYTICS_SECRET:AdminAnalyticsSecret2026!SecureKey}

# ─── Logging & Audit Persistence ──────────────────────────────────────────────
logging.level.com.resumecoach=INFO
logging.level.org.springframework.web=INFO
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=30
