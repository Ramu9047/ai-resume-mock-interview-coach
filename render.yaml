services:
  # ─── Spring Boot Backend Web Service ──────────────────────────────────────────
  - type: web
    name: resume-coach-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore # options: singapore, oregon, frankfurt, ohio
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: GROQ_API_KEY
        sync: false # Set your Groq API Key in Render Dashboard
      - key: ADMIN_ANALYTICS_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Vercel frontend URL e.g. https://your-app.vercel.app

